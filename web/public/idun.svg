<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Rich Sapphire Apple Body -->
    <linearGradient id="apple-body" x1="10" y1="10" x2="38" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="45%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <!-- Vibrant Golden Leaf -->
    <linearGradient id="apple-leaf" x1="24" y1="2" x2="38" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Specular Sheen -->
    <linearGradient id="apple-sheen" x1="12" y1="12" x2="22" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Glyph Drop Shadow -->
    <filter id="glyph-shadow" x="10" y="16" width="28" height="26" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.2" stdDeviation="0.8" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Golden Stem & Leaf -->
  <path d="M23.5 13 C24 8.5 26.5 5.5 28.5 4" stroke="#b45309" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M25 11.5 C25 5 32.5 2.5 38 4 C37.5 10 31.5 13 25 11.5 Z" fill="url(#apple-leaf)"/>

  <!-- Apple Body -->
  <path d="M24 13.5 C17.5 8.5 7.5 12 7.5 25.5 C7.5 38 17 44.5 24 44.5 C31 44.5 40.5 38 40.5 25.5 C40.5 12 30.5 8.5 24 13.5 Z" fill="url(#apple-body)"/>

  <!-- Top-left subtle specular sheen -->
  <path d="M12 24 C12 16.5 17.5 13 22.5 14.5 C17 16.5 13.5 21 13.5 26.5 C13.5 31.5 16.5 37 22 40 C16 38 12 32 12 24 Z" fill="url(#apple-sheen)"/>

  <!-- Integration Monogram "I" with Data Lake Wave -->
  <g filter="url(#glyph-shadow)">
    <!-- Top Serif Bar -->
    <rect x="14" y="18" width="20" height="3.4" rx="1.7" fill="#ffffff"/>

    <!-- Bold Central Stem "I" -->
    <rect x="22.2" y="18" width="3.6" height="17" rx="1.8" fill="#ffffff"/>

    <!-- Flowing Data-Lake Wave crossing the center -->
    <path d="M12 26.5 C16 22 21 31 27 26.5 C31 23.5 34 26 36 27" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Subtle Inner Cyan Flow Accenting Unstructured Nature -->
    <path d="M13 26.5 C17 22.5 21.5 30.5 27 26.5 C30.5 24 33.5 26 35 27" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Bottom Serif Bar -->
    <rect x="14" y="31.6" width="20" height="3.4" rx="1.7" fill="#ffffff"/>
  </g>
</svg>
